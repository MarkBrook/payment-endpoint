services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop_test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

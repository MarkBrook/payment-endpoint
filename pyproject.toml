[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-endpoint"
version = "0.1.0"
description = "HTTP endpoint that pays for an online shop cart."
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "sqlalchemy==2.1.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["shop"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
